# Fixture-only hardware floor: the framework requires every robot config to
# declare at least one motor, and platform nodes own no actuators. This fake
# axis exists solely so the platform assembly forms a valid robot. No node
# reads it (hence no `node` key); nothing outside this fixture may depend
# on it.
[subsystem]
name = "fixture_actuators"
period_us = 5000

[motors.fixture_axis]
type = "TalonFX"
bus = "rio"
can_id = 0
