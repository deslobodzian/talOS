# The bench robot (configuration/robot.toml, its motor and teleop files) plus
# a neighbor motor that stays connected, so a disconnected kraken is the loss
# of one device, as on a robot with more than one, and only the motor node's
# own feedback gate stops it; losing every device is the gateway's fault
# (which disables the robot).
include = "../../configuration/robot.toml"

# Torque mode on, as docs/BENCH.md "Torque current (hardware only)" has a
# person set it at the bench: a test config only. The committed bench config
# keeps it off (node_test.cc's TorqueModeOffAtTheCommittedCap).
[subsystems.motor]
max_bench_torque_current_a = 2.0

[subsystems.motor.motors.kraken]
foc = true
max_torque_current_a = 5.0
# Above the node's max_bench_voltage_v (2 V; the committed config makes them
# equal), so node_test.cc's VoltageIsClampedAndAxisUsesNodeScale proves the
# node's own clamp and not the motor's.
max_voltage = 4.0

[subsystems.neighbor.motors.wheel]
type = "TalonFX"
bus = "rio"
can_id = 2
