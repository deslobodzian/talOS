# The bench robot (configuration/robot.toml with its motor and teleop files)
# plus the swerve module's subsystem file, which the bench configs do not
# launch yet. The module's drive, steer and encoder are three devices, so a
# disconnected encoder is the loss of one, and only the node's own feedback
# gate stops the module; losing every device is the gateway's fault (which
# disables the robot).
include = "../../configuration/robot.toml"

[[subsystems]]
name = "swerve_module"
path = "../../configuration/subsystems/swerve_module.toml"
