[subsystem]
name = "motor"
node = "//bench/main_processor/motor:node"
period_us = 5000
# VOLTAGE mode's scale and clamp in the node: full stick on axis 1 asks this
# many volts, and no VOLTAGE target asks more. Equal to [motors.kraken]
# max_voltage below, which bounds every mode; this one alone keeps the axis
# at 2 V if a person raises that.
max_bench_voltage_v = 2.0
# TORQUE_CURRENT's cap, stator amperes. 0 keeps torque mode off, so button 3
# drives nothing, until a person who has confirmed the Kraken's Phoenix Pro
# licence sets foc = true and max_torque_current_a under [motors.kraken] and
# raises this (docs/BENCH.md "Torque current (hardware only)").
max_bench_torque_current_a = 0.0

[motors.kraken]
type = "TalonFX"
# The bench Kraken's own id and bus, read from the device. The config stays
# uncommissioned until a person has checked inversion and limits at the bench.
bus = "Shooter"
can_id = 1
motor_type = "kraken_x44"
inverted = false
brake = false
supply_limit_a = 30.0
stator_limit_a = 40.0
# The Talon's peak voltage, so it bounds every mode: VOLTAGE, the VELOCITY
# buttons and TORQUE_CURRENT's duty cap. Raise deliberately only after the
# first supervised spins (docs/BENCH.md).
max_voltage = 2.0
sensor_to_mechanism_ratio = 1.0
max_velocity_rps = 30.0
cruise_velocity_rps = 10.0
acceleration_rps2 = 20.0
# Rotor-unit feedforward measured on the restrained bench Kraken X44 at
# 9 to 11 rps in both directions; static friction is not yet separated from it.
slot0 = { p = 0.1, i = 0.0, d = 0.0, s = 0.0, v = 0.095, a = 0.0, g = 0.0 }

[teleop]
defaults = { mode = "VOLTAGE", voltage_v = 0.0, velocity_rps = 0.0, voltage_frac = 0.0, torque_current_a = 0.0 }

# Buttons take precedence over the axis; among held buttons the lowest wins
# (1, then 2, then 3: the first binding listed).
[[teleop.bindings]]
button = 1
while_held = { mode = "VELOCITY", velocity_rps = 10.0 }

# 30 rps is past the free speed at max_voltage (2 V / slot0 v, about 21 rps):
# the motor levels there, a bench check that the limit holds in VELOCITY mode.
[[teleop.bindings]]
button = 2
while_held = { mode = "VELOCITY", velocity_rps = 30.0 }

# Stator current, capped by max_bench_torque_current_a (0: drives nothing).
[[teleop.bindings]]
button = 3
while_held = { mode = "TORQUE_CURRENT", torque_current_a = 2.0 }

# Joystick 0 axis 1: normalized fraction scaled by max_bench_voltage_v.
[[teleop.bindings]]
axis = 1
field = "voltage_frac"
scale = -1.0
deadband_frac = 0.1
