# mujoco_rig, generated by //tools:new_robot. The robot's only list of nodes is
# [[subsystems]] below; after adding or removing an entry, regenerate
# robot_manifest.bzl:
#   bazel run //tools:sync_manifest -- examples/mujoco_rig/main_processor/configuration/robot.toml
# (`bazel run //tools:new_subsystem -- <name> --lang cpp|py --robot examples/mujoco_rig`
# adds a mechanism and does that for you.)
[robot]
name = "mujoco_rig"
# The default tick: how often a node's update() runs, unless its subsystem
# file sets its own period_us.
period_us = 5000
# How old hardware state, a Driver Station packet or a target may be before
# the robot goes neutral.
command_timeout_us = 100000
status_hz = 200.0
# A person sets this true at the robot, after checking every CAN id; never
# from a desk (docs/BRINGUP.md). A commissioned robot also requires target
# coverage: the launcher refuses a subsystem that some Driver Station mode's
# policy lanes leave without a writer. require_target_coverage = true asks
# for that before commissioning: each mechanism then needs at least one
# writer among each mode's lanes, or a [targets] listing no lane in any
# mode, which keeps it neutral (new_subsystem writes one for each mechanism
# it adds then).
commissioned = false
# The program that stands in for the RoboRIO under `./sim.sh --sim-gateway`
# is robot_sim.toml's: the MuJoCo gateway.

# Where the RoboRIO is, as seen from the main processor: loopback for
# simulation. On the robot set its address (e.g. "10.TE.AM.2") or pass the
# launcher --remote ADDR.
controller_address = "127.0.0.1"
controller_port = 5802
local_port = 5803

# Which target lanes (/<subsystem>/target/<source>) each Driver Station mode
# obeys, highest priority first. A subsystem file's [targets] replaces the
# modes it lists. Add "auto" to autonomous once an autonomous node writes
# lanes.
[robot.targets]
teleop = ["teleop"]
autonomous = []
test = []

# Studio, the live viewer: ./sim.sh starts its bridge, which shows what the
# telemetry node publishes on `topic`.
[studio]
topic = "/talos/telemetry"

# One entry per subsystem; `path` is relative to this file.
[[subsystems]]
name = "teleop"
path = "subsystems/teleop.toml"

[[subsystems]]
name = "telemetry"
path = "subsystems/telemetry.toml"

[[subsystems]]
name = "flywheel"
path = "subsystems/flywheel.toml"

[[subsystems]]
name = "feeder"
path = "subsystems/feeder.toml"
