# No hardware: reads its goal on /superstructure/target/teleop and
# /superstructure/target/auto (the default [robot.targets] policy) and the
# mechanism states, and writes /intake/target/superstructure and
# /elevator/target/superstructure.
[subsystem]
name = "superstructure"
period_us = 20000
high_rot = 10.0  # elevator height for SCORE_HIGH, within the lift's soft limits
