# Roller + beam break. IDLE -> INTAKING -> HOLDING (beam broken) -> EJECTING.
[subsystem]
name = "intake"
period_us = 20000

# The roller's talos::mechanisms::RollerWithSensor parameters
# (talOS/mechanisms/README.md).
[roller]
sensor = "beam_break"  # the [digital_inputs] entry that sees a piece
intake_v = 8.0         # roller voltage while intaking
hold_v = 1.0           # keeps a held piece seated
eject_v = -10.0        # reverse, to spit the piece out
eject_us = 500000      # how long EJECTING runs before IDLE (500 ms)

# Who drives the intake, per Driver Station mode (highest priority first):
# only the superstructure's lane, /intake/target/superstructure, in both
# teleop and autonomous. Replaces [robot.targets]' teleop/autonomous lists.
[targets]
teleop = ["superstructure"]
autonomous = ["superstructure"]

[motors.roller]
type = "TalonFX"
bus = "rio"
can_id = 1
inverted = false
brake = true
supply_limit_a = 30.0
stator_limit_a = 60.0
max_voltage = 12.0
sensor_to_mechanism_ratio = 1.0
max_velocity_rps = 100.0

# true while a game piece breaks the beam.
[digital_inputs.beam_break]
dio = 0
