# The superstructure example robot: an intake, an elevator, and the
# superstructure node that coordinates them over topics. Each subsystem's
# devices and the custom keys its node reads with node.param<T>("key") live in
# subsystems/<name>.toml. This manifest launches the cpp/ nodes; robot_py.toml
# is the same robot with the py/ nodes, and differs only in the `node =` lines.
[robot]
name = "superstructure_example"
period_us = 5000
command_timeout_us = 100000
status_hz = 200.0
commissioned = false
sim_gateway = "//2026-robot/main_processor/simulation:sim_gateway"
controller_address = "127.0.0.1"
controller_port = 5802
local_port = 5803

[[subsystems]]
name = "intake"
path = "subsystems/intake.toml"
node = "//examples/superstructure/cpp:intake"

[[subsystems]]
name = "elevator"
path = "subsystems/elevator.toml"
node = "//examples/superstructure/cpp:elevator"

[[subsystems]]
name = "superstructure"
path = "subsystems/superstructure.toml"
node = "//examples/superstructure/cpp:superstructure"
