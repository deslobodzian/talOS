# The superstructure example robot, launching the py/ nodes. Same robot and
# subsystem files as robot.toml; only the `node =` lines differ.
include = "robot.toml"

[[subsystems]]
name = "intake"
node = "//examples/superstructure/py:intake"

[[subsystems]]
name = "elevator"
node = "//examples/superstructure/py:elevator"

[[subsystems]]
name = "superstructure"
node = "//examples/superstructure/py:superstructure"
