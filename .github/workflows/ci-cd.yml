name: Cloud Build

# Runs one lane of the suite on a 16-core Spot VM in Google Cloud, against
# the bazel-remote cache VM (scripts/, .bazelrc build:gcp):
#   gh workflow run "Cloud Build" --ref <branch> -f lane=fast
# The lanes and their inputs are described in scripts/README.md.
#
# Started by hand only. It is a trusted writer of the shared cache, so it
# must never run code from a fork: do not add a pull_request trigger.
# The repository has no service to deploy, so there is no deploy job.
#
# Needs the repository variables scripts/setup-gcp-wif.sh prints.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: What to run after bazel build //...
        type: choice
        default: replay
        options:
        - replay   # the replay tests, found by query
        - fast     # bazel test --config=fast //...
        - full     # bazel test //...
        - asan     # tools/sanitizer_lane.sh asan
        - tsan     # tools/sanitizer_lane.sh tsan
        - soak     # the bench soak, once per seed 0..count-1
        - stress   # bazel test --runs_per_test=count //..., to find flakes
        - rtprio   # //talOS/process tests under a realtime grant (TEST-8)
      count:
        description: Seeds for soak, or runs of every test for stress
        type: string
        default: "8"
      max_minutes:
        description: Minutes after which Google deletes the VM
        type: choice
        default: "20"
        options: ["20", "40", "60"]

permissions:
  contents: read
  id-token: write   # the OIDC token Workload Identity Federation exchanges

concurrency:
  group: cloud-build-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ZONE: us-east4-a
  SUBNET: talos-ci-us-east4
  BUILD_SA: ci-build-vm@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  # One VM per run attempt, so a re-run never meets the last attempt's VM.
  VM: talos-ci-${{ github.run_id }}-${{ github.run_attempt }}
  LANE: ${{ inputs.lane }}
  MAX_MINUTES: ${{ inputs.max_minutes }}
  COUNT: ${{ inputs.count }}

jobs:
  spot-build:
    name: ${{ inputs.lane }} lane (Spot VM)
    runs-on: ubuntu-latest
    # The VM deletes itself at max_minutes (60 at most); the rest is
    # creation and cleanup.
    timeout-minutes: 70
    steps:
    - name: Check the inputs
      # count reaches a shell on the VM, so it is a whole number or nothing.
      run: |
        case "$COUNT" in
          ''|*[!0-9]*) echo "::error::count must be a whole number"; exit 1 ;;
        esac
        if [ "$COUNT" -lt 1 ] || [ "$COUNT" -gt 200 ]; then
          echo "::error::count must be between 1 and 200"
          exit 1
        fi

    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Create the Spot VM
      # Deleted three ways: by Google when it is preempted or reaches
      # --max-run-duration, by the trap below if this step fails part way,
      # and by the always() step at the end of the job.
      run: |
        trap 'status=$?; [ $status -eq 0 ] ||
          gcloud compute instances delete "$VM" --project="$PROJECT_ID" \
            --zone="$ZONE" --quiet || true; exit $status' EXIT
        gcloud compute instances create "$VM" \
          --project="$PROJECT_ID" --zone="$ZONE" \
          --machine-type=n2d-standard-16 \
          --provisioning-model=SPOT \
          --instance-termination-action=DELETE \
          --max-run-duration="${MAX_MINUTES}m" \
          --image-family=ubuntu-2404-lts-amd64 --image-project=ubuntu-os-cloud \
          --boot-disk-size=100GB --boot-disk-type=pd-balanced \
          --network-interface="subnet=$SUBNET,no-address" \
          --tags=ci-build \
          --service-account="$BUILD_SA" --scopes=logging-write \
          --metadata=enable-oslogin=TRUE \
          --labels=purpose=ci,run="$GITHUB_RUN_ID"
        # sshd is not up the moment the instance is: about a minute at most.
        for attempt in $(seq 1 30); do
          if gcloud compute ssh "$VM" --project="$PROJECT_ID" --zone="$ZONE" \
               --tunnel-through-iap --command=true 2>/dev/null; then
            exit 0
          fi
          echo "waiting for SSH ($attempt/30)"
          sleep 5
        done
        echo "::error::the Spot VM never accepted SSH"
        exit 1

    - name: Copy the commit to the VM
      run: |
        git archive --format=tar.gz --prefix=talos/ -o "$RUNNER_TEMP/src.tar.gz" HEAD
        gcloud compute scp "$RUNNER_TEMP/src.tar.gz" "$VM":src.tar.gz \
          --project="$PROJECT_ID" --zone="$ZONE" --tunnel-through-iap

    - name: Build and run the lane
      # A preemption or the run-duration limit ends the SSH session, which
      # fails this step; the VM is already gone then.
      run: |
        gcloud compute ssh "$VM" --project="$PROJECT_ID" --zone="$ZONE" \
          --tunnel-through-iap --command="LANE=$LANE COUNT=$COUNT bash -s" <<'REMOTE'
        set -euo pipefail
        tar xzf src.tar.gz
        cd talos
        # The toolchain the repository's own setup installs (bazelisk as
        # `bazel`, g++, python3, Node and pnpm); no RoboRIO or lint tools.
        tools/setup.sh --yes --no-rio --no-lint
        # Two kernel settings as GitHub's Ubuntu runners have them. Ubuntu
        # 24.04's 32 bits of mmap randomization put mappings where
        # ThreadSanitizer cannot track them ("unexpected memory mapping"),
        # and its AppArmor default refuses the unprivileged user namespace
        # //talOS/protocol:udp_address_change_test needs.
        sudo sysctl -w vm.mmap_rnd_bits=28 \
          kernel.apparmor_restrict_unprivileged_userns=0
        # A short output base. The OS Login account's name is 24 characters,
        # and under ~/.cache/bazel the hermetic Python's path passes the
        # kernel's 255-character limit on a script's "#!" line, which a test
        # that writes such a script (//talOS/build:sim_check_no_state_test)
        # then fails on with "Exec format error".
        sudo install -d -o "$(id -u)" -g "$(id -g)" /b
        echo 'startup --output_user_root=/b' >> ~/.bazelrc
        bazel build --config=gcp //...
        case "$LANE" in
          fast) exec bazel test --config=gcp --config=fast --test_output=errors //... ;;
          full) exec bazel test --config=gcp --test_output=errors //... ;;
          asan|tsan) exec tools/sanitizer_lane.sh "$LANE" --config=gcp ;;
          soak)
            # CI's soak (soak.yaml) with seeds 0..COUNT-1, one after the
            # other: the test loads the whole host. The target is `manual`,
            # so the build above left it out. A failed seed's log is kept
            # where the next seed does not overwrite it.
            soak=//bench/main_processor/simulation:soak_test
            bazel build --config=gcp "$soak"
            failed=""
            for seed in $(seq 0 $((COUNT - 1))); do
              echo "== soak seed $seed"
              if ! bazel test --config=gcp --test_output=errors \
                   --cache_test_results=no \
                   --test_env=TALOS_SOAK_SECONDS=180 \
                   --test_env=TALOS_SOAK_SEED="$seed" "$soak"; then
                failed="$failed $seed"
                mkdir -p "failed-soak/seed-$seed"
                cp -RL bazel-testlogs/bench/main_processor/simulation/soak_test/. \
                  "failed-soak/seed-$seed/" || true
              fi
            done
            if [ -n "$failed" ]; then
              echo "soak failed for seed(s):$failed" >&2
              exit 1
            fi
            exit 0 ;;
          stress)
            # Every test COUNT times with the 16 cores loaded. A test that
            # fails once here is a flake (docs/TESTING.md §8), not noise.
            exec bazel test --config=gcp --test_output=errors --keep_going \
              --cache_test_results=no --runs_per_test="$COUNT" //... ;;
          rtprio)
            # A realtime grant for this shell, and so for the Bazel server
            # started from it and the tests it runs: the limit is inherited.
            # Without it ProcessTest.BackgroundThreadLeavesAnInheritedRealtimePolicy
            # skips (TODO.md TEST-8), so the lane fails unless that test ran.
            sudo prlimit --pid $$ --rtprio=99:99
            bazel shutdown
            bazel test --config=gcp --test_output=all --cache_test_results=no \
              //talOS/process/... | tee rtprio.log
            if ! grep -q 'OK \] ProcessTest.BackgroundThreadLeavesAnInheritedRealtimePolicy' rtprio.log; then
              echo "the realtime test did not run to OK under the grant" >&2
              exit 1
            fi
            exit 0 ;;
          replay) ;;
          *) echo "unknown lane: $LANE" >&2; exit 2 ;;
        esac
        # Every test target whose name says replay, so a new one is picked
        # up without editing this file. --keep_going: some external
        # packages do not load on every host (docs/DEVELOPMENT.md §5).
        # No --config=gcp: it is a build config, and query refuses a config
        # no query line defines. Exit 3 is a partial result, which is usable.
        status=0
        replay="$(bazel query --keep_going \
          'kind(".*_test rule", //...) intersect filter("replay", //...) except attr(tags, manual, //...)' \
          2>query.log)" || status=$?
        if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
          cat query.log >&2
          exit "$status"
        fi
        if [ -z "$replay" ]; then
          echo "no replay test targets found" >&2
          exit 1
        fi
        echo "Replay tests:"; echo "$replay"
        # shellcheck disable=SC2086
        bazel test --config=gcp --test_output=errors $replay
        REMOTE

    - name: Fetch the test logs
      # Nothing to fetch when the VM is already gone (preempted or timed
      # out): the step then says so and passes.
      if: failure()
      run: |
        if gcloud compute ssh "$VM" --project="$PROJECT_ID" --zone="$ZONE" \
             --tunnel-through-iap --command='cd talos &&
               find -L bazel-testlogs failed-soak -name test.log > ~/testlogs.txt 2>/dev/null;
               [ -s ~/testlogs.txt ] &&
               tar czf ~/testlogs.tar.gz -T ~/testlogs.txt' &&
           gcloud compute scp "$VM":testlogs.tar.gz "$RUNNER_TEMP/testlogs.tar.gz" \
             --project="$PROJECT_ID" --zone="$ZONE" --tunnel-through-iap; then
          echo "have_logs=1" >> "$GITHUB_ENV"
        else
          echo "no test logs fetched (the VM may already be gone)"
        fi

    - name: Upload the test logs
      if: failure() && env.have_logs == '1'
      uses: actions/upload-artifact@v4
      with:
        name: cloud-build-testlogs-${{ inputs.lane }}
        path: ${{ runner.temp }}/testlogs.tar.gz
        retention-days: 7

    - name: Delete the Spot VM
      if: always()
      run: |
        if gcloud compute instances describe "$VM" --project="$PROJECT_ID" \
             --zone="$ZONE" >/dev/null 2>&1; then
          gcloud compute instances delete "$VM" --project="$PROJECT_ID" \
            --zone="$ZONE" --quiet
        else
          echo "VM $VM is already gone"
        fi
