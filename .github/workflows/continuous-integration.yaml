# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
# See also: https://github.com/marketplace/actions/bazel-action
#
name: Continuous Integration
on:
  push:
    branches:
      - main
      - hardening/**
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Bazel Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true

    - name: Build
      run: bazel build //... --noshow_progress --test_output=errors

    - &runfiles-collisions
      name: No runfiles path is both generated-empty and a source file
      # A reused sandbox writes an empty generated file through a stale
      # symlink left by another test's runfiles, truncating the source.
      run: python3 tools/check_runfiles_collisions.py

    - name: Checked-in Studio bindings match the telemetry_ts genrule
      # pnpm and tsc read studio/src/generated; Bazel builds Studio from the
      # //studio:telemetry_ts genrule (the same pinned flatc `pnpm generate`
      # runs). A schema edit without `pnpm generate` fails here.
      run: diff -ru bazel-bin/studio/src/generated studio/src/generated

    # The two steps below are anchored and reused by build-macos.
    - &make-read-only
      name: Make tracked source files read-only
      # A reused Bazel sandbox once truncated talOS/python/talos/__init__.py
      # by creating a generated empty file through a stale symlink to it
      # (tools/check_runfiles_collisions.py now prevents that layout). With
      # every tracked regular file read-only, a recurrence fails as "Could
      # not copy inputs into sandbox: ... (Permission denied)" naming the
      # test, instead of corrupting the checkout. Directories stay writable
      # (Bazel's convenience symlinks); MODULE.bazel.lock stays writable.
      run: |
        python3 - <<'EOF'
        import os, subprocess
        listing = subprocess.run(["git", "ls-files", "-s", "-z"],
                                 capture_output=True, check=True).stdout
        for entry in filter(None, listing.split(b"\0")):
            meta, path = entry.split(b"\t", 1)
            if meta.startswith((b"100644", b"100755")) and path != b"MODULE.bazel.lock":
                os.chmod(path, os.stat(path).st_mode & ~0o222)
        EOF

    - name: Test
      run: bazel test //... --noshow_progress --test_output=errors

    - &checkout-unchanged
      name: Checkout unchanged by the build and tests
      # Runs after failed tests too: a source truncation fails the tests,
      # and this is the evidence. Modified tracked files and untracked,
      # non-ignored files both fail it.
      if: ${{ !cancelled() }}
      run: |
        status="$(git status --porcelain --untracked-files=all)"
        if [ -n "$status" ]; then
          printf '%s\n' "$status"
          git diff --stat
          exit 1
        fi

  sanitizers:
    name: Bazel (${{ matrix.sanitizer }}, ${{ matrix.os }})
    # macOS is the deployment OS: its RTMS process-identity and F_FULLFSYNC
    # paths compile only there.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [asan, tsan]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.sanitizer }}
        repository-cache: true
    - name: Test instrumented suite and bounded decoder corpora
      run: bazel test --config=${{ matrix.sanitizer }} --test_tag_filters=-no_${{ matrix.sanitizer }}${{ runner.os == 'macOS' && ',-no_macos_sanitizer' || '' }} --test_output=errors //...

  build-macos:
    name: Bazel Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Build
      run: bazel build //... --noshow_progress --test_output=errors

    - *runfiles-collisions

    - *make-read-only

    - name: Test
      run: bazel test //... --noshow_progress --test_output=errors

    - name: Process limits and counts after a failure
      # TODO.md INC-5: a probe whose spawn names `fork (guardian)` or `fork`
      # with EAGAIN ran out of process slots. These are the limits and what
      # is still running once the tests end, not the peak.
      if: ${{ failure() }}
      run: |
        sysctl kern.maxproc kern.maxprocperuid
        echo "ulimit -u: $(ulimit -u)"
        echo "processes: $(ps -A | wc -l)"
        echo "processes of uid $(id -u): $(ps -U "$(id -u)" | wc -l)"

    - *checkout-unchanged

  soak:
    name: Soak (${{ matrix.os }})
    # Minutes of the full simulated graph under SIGKILL/SIGSTOP chaos
    # (2026-robot/main_processor/simulation/README.md); pushes only, with
    # fault-order seed 0 on topic branches and seed 1 on main, so main runs
    # an order the branches did not. The target is `manual`, so
    # `bazel test //...` never runs it.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/hardening/') ||
       startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-soak
        repository-cache: true

    # Built first, so the host recording below covers only the test.
    - name: Build
      run: >-
        bazel build //2026-robot/main_processor/simulation:soak_test
        --noshow_progress

    - name: Soak
      env:
        SOAK_SEED: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
      # Records the host once a second for the test's duration into host/
      # beside the test's logs, which a failure keeps: paging (vm_stat,
      # vmstat), the busiest processes (top) and, on macOS, the busiest
      # threads with their priority and policy (ps -M: T timeshare, R
      # realtime), which macOS top cannot show. A stall of the whole
      # host shows there and in no log of the test's own. The test's `long`
      # timeout bounds the recording to 15 minutes, a few MB.
      run: |
        logs=bazel-testlogs/2026-robot/main_processor/simulation/soak_test
        host="$RUNNER_TEMP/soak-host"
        mkdir -p "$host"
        # Job control puts each recorder pipeline in its own process group.
        set -m
        finish() {
          for job in $(jobs -p); do kill -- "-$job" 2>/dev/null || true; done
          mkdir -p "$logs"
          cp -R "$host" "$logs/host" || true
        }
        trap finish EXIT
        if [ "$RUNNER_OS" = macOS ]; then
          vm_stat 1 2>&1 | perl -MPOSIX -ne \
            '$| = 1; print strftime("%H:%M:%S ", localtime), $_' \
            > "$host/vm_stat.log" &
          top -l 0 -s 1 -o cpu -n 30 -stats pid,command,cpu,state,threads \
            > "$host/top.log" 2>&1 &
          while sleep 1; do
            date +%T
            # A thread's row omits USER and TT, so %CPU is its second field.
            ps -A -M | awk 'NR > 1 { print (($1 ~ /^[0-9]+$/) ? $2 : $4) "\t" $0 }' \
              | sort -rn | head -60 | cut -c1-160
          done > "$host/threads.log" 2>&1 &
        else
          vmstat -t 1 > "$host/vmstat.log" 2>&1 &
          top -b -d 1 -w 200 -o %CPU 2>&1 \
            | awk '/^top -/ { n = 0 } n++ < 47' > "$host/top.log" &
        fi
        bazel test //2026-robot/main_processor/simulation:soak_test \
          --noshow_progress --test_output=all \
          --test_env=TALOS_SOAK_SECONDS=180 \
          --test_env=TALOS_SOAK_SEED="$SOAK_SEED"

    - name: Keep the failed session
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: soak-${{ matrix.os }}
        path: bazel-testlogs/2026-robot/main_processor/simulation/soak_test/
        if-no-files-found: ignore

  rio-adapter:
    name: RIO adapter (GradleRIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 2026-robot/controller_processor/rio
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Java (GradleRIO needs a JDK; the wrapper itself is pinned)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Install RoboRIO toolchain
      # buildRio cross-compiles for linuxathena, and GradleRIO refuses to
      # configure the project at all until the toolchain is installed.
      run: ./gradlew installRoboRioToolchain

    - name: Desktop adapter test
      # PhoenixBackend encoder + sim-honesty regressions in src/test/cpp:
      # the actual adapter code, compiled and run on desktop through the
      # WPILib simulation HAL. (phoenixTest is the stable aggregator the
      # build.gradle registers over the per-variant google-test run tasks
      # the testSuites block wires up.)
      run: ./gradlew phoenixTest

    - name: RoboRIO target build
      # Cross-compile the deployed frcUserProgram for linuxathena. This is
      # the artifact `deploy` ships; it never runs in CI, it must compile.
      run: ./gradlew buildRio

  rio-in-the-loop:
    name: RoboRIO program in the loop (WPILib sim)
    # The deployed RoboRIO program (Robot.cpp: its Driver Station loop,
    # gateway and Phoenix 6 backend) run as a desktop simulation against the
    # Bazel-built bridge and drivetrain node: tools/test_drivetrain.py
    # --wpilib drives, checks the neutral stop when commands end, replays the
    # node's log, and checks a never-enabled robot does not move. -Pheadless
    # (set by the script) loads no simulation GUI, so no display is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Setup Java (GradleRIO needs a JDK; the wrapper itself is pinned)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Build the main-processor side
      run: >-
        bazel build --noshow_progress
        //2026-robot/main_processor/drivetrain:all
        //talOS/bridge:hardware_node

    - name: Install RoboRIO toolchain
      # GradleRIO refuses to configure the project until it is installed,
      # even for a desktop-only task.
      working-directory: 2026-robot/controller_processor/rio
      run: ./gradlew installRoboRioToolchain

    - name: Build and start the desktop simulation once
      # The test runs Gradle with --offline, so everything simulateNative
      # resolves (WPILib and Phoenix simulation natives) is fetched here.
      # The robot, disabled, stops itself after two seconds; the first
      # launch of the program and its Phoenix simulation happens here
      # rather than in the test.
      working-directory: 2026-robot/controller_processor/rio
      env:
        TALOS_SIM_DS: '0'
        TALOS_SIM_RUN_MS: '2000'
      run: timeout 900 ./gradlew -Pheadless simulateNative

    - name: Drivetrain against the RoboRIO program
      timeout-minutes: 10
      run: python3 tools/test_drivetrain.py --wpilib --output-dir "$RUNNER_TEMP/rio-in-the-loop"

    - name: Keep the failed run's logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: rio-in-the-loop
        path: ${{ runner.temp }}/rio-in-the-loop/
        if-no-files-found: ignore

  buildifier:
    name: Buildifier (changed Starlark files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        # Full history is needed to diff against the PR base / push base.
        fetch-depth: 0

    - name: Install buildifier
      # Version and sha256 are pinned once, in tools/setup.sh.
      run: |
        eval "$(grep -E '^BUILDIFIER_(VERSION|SHA256_amd64)=' tools/setup.sh)"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/buildifier" \
          "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION:?}/buildifier-linux-amd64"
        echo "${BUILDIFIER_SHA256_amd64:?}  $RUNNER_TEMP/buildifier" | sha256sum -c -
        install -m 0755 "$RUNNER_TEMP/buildifier" /usr/local/bin/buildifier
        buildifier --version

    - &diff-base
      name: Choose the diff base
      # Reused by clang-format and clang-tidy. A pull request checks every
      # file its branch changed since it left the base branch, so a commit
      # whose earlier run was cancelled or failed is checked again by every
      # later run. A push checks the commits it pushed; on main, `before` is
      # the old tip, which is the merge base of what was merged. A new branch
      # (all-zero `before`) or a force push (`before` absent from the clone
      # or not an ancestor of HEAD) falls back to the merge base with main;
      # on main, where that merge base is HEAD itself, to HEAD's first parent.
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$EVENT" = pull_request ]; then
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
        elif [ -n "$BEFORE" ] &&
             [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
             git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
          base="$BEFORE"
        else
          base="$(git merge-base origin/main HEAD)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
        fi
        echo "Diff base: $(git log -1 --format='%H %s' "$base")"
        echo "BASE=$base" >> "$GITHUB_ENV"

    - name: Check changed Starlark files
      run: |
        # Check mode only: never rewrites files. Scoped to the files changed
        # since $BASE so pre-existing tree state stays untouched.
        git diff --name-only --diff-filter=d -z "$BASE" HEAD -- \
          'BUILD' 'BUILD.bazel' '*/BUILD' '*/BUILD.bazel' '*.bzl' \
          'MODULE.bazel' '*/MODULE.bazel' \
          | xargs -0 -r buildifier --mode=check --lint=warn

  clang-format:
    name: clang-format (changed C++ files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-18

    - *diff-base

    - name: Check changed C/C++ files
      run: |
        # --dry-run --Werror: check only, never reformats. .clang-format at
        # the repo root is picked up automatically. third_party/ is vendored
        # upstream source (metal-cpp) and keeps its upstream formatting.
        git diff --name-only --diff-filter=d -z "$BASE" HEAD -- \
          '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/' \
          | xargs -0 -r clang-format-18 --dry-run --Werror

  clang-tidy:
    name: clang-tidy (changed C++ files)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true

    - name: Install clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-18

    - name: Build first so generated headers exist
      # clang-tidy resolves headers through bazel-out/external, including
      # generated ones (e.g. flatbuffers virtual includes). refresh_all only
      # extracts commands, so without a prior build the database points at
      # headers that were never materialized and every TU including them
      # fails with a compiler error. The shared disk cache keeps this fast.
      run: bazel build //... --noshow_progress

    - name: Refresh compilation database
      # Hedron's Compile Commands Extractor (already a dev_dependency in
      # MODULE.bazel) generates compile_commands.json for clang-tidy.
      run: bazel run @hedron_compile_commands//:refresh_all --noshow_progress

    - *diff-base

    - name: Run clang-tidy on changed sources and headers
      run: |
        # Analyze TUs in the Bazel graph: each changed source, tests
        # included, plus up to TUS_PER_HEADER includers of each changed
        # header (direct or transitive; production includers for a
        # production header). A changed source missing from the database
        # fails the step.
        # NUL-delimited git output also handles paths containing whitespace.
        python3 - "$BASE" <<'PYEOF'
        import concurrent.futures, json, os, pathlib, re, subprocess, sys, time
        SOURCES = ('.c', '.cc', '.cpp')
        HEADERS = ('.h', '.hpp')
        # Sources the Linux build graph never compiles, so they have no
        # compilation database entry: the GradleRIO program and its tests
        # (rio-adapter job) and sources selected only for other platforms.
        # Paths in .bazelignore are outside the graph too and are read from
        # there.
        OFF_GRAPH = ('2026-robot/controller_processor/rio/',
                     'talOS/events/os/kqueue_poller.cc',
                     'talOS/vision/capture/unsupported_source.cc')
        # A changed header is analyzed through at most this many translation
        # units that include it, nearest includers first.
        TUS_PER_HEADER = 4
        # Test code reads an optional after gtest's ASSERT_TRUE(opt), which
        # this check cannot see through; every other check applies to tests.
        TEST_CHECKS = '-bugprone-unchecked-optional-access'

        def git(*args):
            return [p for p in subprocess.check_output(['git', *args]).decode().split('\0') if p]

        def ours(rel):
            return not {'external', 'third_party'}.intersection(
                pathlib.PurePosixPath(rel).parts)

        def production(rel):
            path = pathlib.PurePosixPath(rel)
            return ours(rel) and not (
                {'test', 'tests', 'testing', 'testdata'}.intersection(path.parts) or
                path.stem in {'test', 'testing'} or
                path.stem.endswith(('_test', '_testing')) or
                'fuzz' in path.stem)

        with open('.bazelignore') as f:
            ignored = tuple(line.strip().rstrip('/') + '/' for line in f
                            if line.strip() and not line.startswith('#'))
        with open('compile_commands.json') as f:
            db = json.load(f)
        root = os.getcwd()
        tus = set()
        for e in db:
            if e['file'].endswith(SOURCES):
                rel = os.path.relpath(os.path.realpath(os.path.join(e['directory'], e['file'])), root)
                if ours(rel):
                    tus.add(rel)

        changed = [rel for rel in git('diff', '--name-only', '--diff-filter=d', '-z', sys.argv[1], 'HEAD',
                                      '--', *('*' + ext for ext in SOURCES + HEADERS))
                   if ours(rel) and not rel.startswith(ignored)]
        targets, missing = [], []
        for rel in changed:
            if not rel.endswith(SOURCES):
                continue
            if rel in tus:
                targets.append(rel)
            elif not rel.startswith(OFF_GRAPH):
                missing.append(rel)

        headers = [rel for rel in changed if rel.endswith(HEADERS)]
        if headers:
            # Reverse include graph over tracked files. A quoted include next to its
            # includer resolves there; otherwise to every tracked header whose path
            # ends with the spelling, which over-approximates when two headers share
            # a suffix: an extra includer is analyzed, none missed.
            tracked = git('ls-files', '-z', *('*' + ext for ext in SOURCES + HEADERS))
            tracked_set = set(tracked)
            by_name = {}
            for rel in tracked:
                if rel.endswith(HEADERS):
                    by_name.setdefault(os.path.basename(rel), []).append(rel)
            include = re.compile(rb'^\s*#\s*include\s*(["<])([^">]+)[">]', re.M)
            includers = {}
            for rel in tracked:
                with open(rel, 'rb') as f:
                    for quote, spelled in include.findall(f.read()):
                        spelled = spelled.decode(errors='replace')
                        local = os.path.normpath(os.path.join(os.path.dirname(rel), spelled))
                        if quote == b'"' and local in tracked_set:
                            resolved = [local]
                        else:
                            resolved = [h for h in by_name.get(os.path.basename(spelled), ())
                                        if h == spelled or h.endswith('/' + spelled)]
                        for header in resolved:
                            includers.setdefault(header, set()).add(rel)
            for header in headers:
                found, seen, frontier = [], {header}, [header]
                while frontier and len(found) < TUS_PER_HEADER:
                    level = sorted({i for h in frontier for i in includers.get(h, ())} - seen,
                                   key=lambda p: (os.path.dirname(p) != os.path.dirname(header), p))
                    seen.update(level)
                    found += [p for p in level if p in tus and
                              (production(p) or not production(header))][:TUS_PER_HEADER - len(found)]
                    frontier = [p for p in level if p.endswith(HEADERS)]
                if found:
                    print(f'{header}: via {", ".join(found)}')
                    targets += found
                elif production(header):
                    print(f'{header}: no production translation unit includes it; not analyzed')
                else:
                    print(f'{header}: no translation unit includes it; not analyzed')
        targets = list(dict.fromkeys(targets))

        for rel in missing:
            print(f'::error file={rel}::changed source has no compilation '
                  'database entry; add it to a Bazel target or to OFF_GRAPH in this step')
        if not targets:
            print('No changed C++ to analyze.')
            sys.exit(1 if missing else 0)
        # One clang-tidy per core: a single process over a large PR's
        # translation units ran for most of an hour.
        def tidy(path):
            checks = [] if production(path) else [f'--checks={TEST_CHECKS}']
            return subprocess.run(['clang-tidy-18', '-p', '.', '--quiet', *checks, path],
                                  capture_output=True, text=True)
        failed = 0
        start = time.monotonic()
        with concurrent.futures.ThreadPoolExecutor(os.cpu_count()) as pool:
            for path, r in zip(targets, pool.map(tidy, targets)):
                if r.returncode != 0:
                    failed += 1
                    print(f'::group::{path}')
                    print(r.stdout + r.stderr, end='')
                    print('::endgroup::')
        print(f'clang-tidy: {len(targets)} files, {failed} with findings, '
              f'{time.monotonic() - start:.1f}s')
        sys.exit(1 if failed or missing else 0)
        PYEOF
