# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
# See also: https://github.com/marketplace/actions/bazel-action
#
# Every push and pull request. Hosted macOS builds and runs the suite without
# the full-graph timed tests; its sanitizer legs and soak run in nightly.yaml.
# `gate` needs every job here and is the one check to require.
#
# Caches (bazel-contrib/setup-bazel): one disk cache per OS and Bazel
# configuration (`plain`, `asan`, `tsan`; the action adds the OS to the key).
# Only runs on main save, and of the jobs sharing a key only the one that
# builds //... does; every other run restores main's cache.
name: Continuous Integration
on:
  push:
    branches:
      - main
      - hardening/**
      - feature/**
  pull_request:
    branches:
      - main

# A newer push to the same branch or pull request cancels the older run.
# Runs on main are never cancelled: each one saves the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux (build, test, clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TESTLOGS: linux
      # The diff base step checks the whole branch on a topic-branch push,
      # so clang-tidy checks again what an earlier push left failing.
      DIFF_SCOPE: branch
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        # Full history is needed to diff against the PR base / push base.
        fetch-depth: 0

    - &diff-base
      name: Choose the diff base
      # Reused by buildifier, clang-format, clang-tidy and the source lints'
      # commissioning check. A pull request
      # checks every file its branch changed since it left the base branch,
      # so a commit whose earlier run was cancelled or failed is checked
      # again by every later run. A topic-branch push does the same, against
      # the merge base with main, in a job that sets DIFF_SCOPE=branch
      # (every job that uses it: buildifier, clang-format, lint and the
      # Linux job's clang-tidy). Otherwise (main) a push
      # checks the commits it pushed; on main, `before` is the old tip,
      # which is the merge base of what was merged. A new branch (all-zero
      # `before`) or a force push (`before` absent from the clone or not an
      # ancestor of HEAD) falls back to the merge base with main. Where
      # that merge base is HEAD itself (main, or a branch at main's tip),
      # the base is HEAD's first parent.
      #
      # The commissioning check takes COMMISSIONING_BASE, which must cover
      # every commit the event adds: BASE, except on a push to main that is
      # not a fast-forward. A force push diffs against the merge base with
      # the old tip (fetched by id: no ref holds it any more); when that tip
      # cannot be fetched or shares no history with HEAD, or the push
      # creates main (all-zero `before`), COMMISSIONING_GAP names why and
      # the lint job fails rather than check only HEAD's first parent.
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$EVENT" = pull_request ]; then
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
        elif { [ "${DIFF_SCOPE:-}" != branch ] ||
               [ "$GITHUB_REF" = refs/heads/main ]; } &&
             [ -n "$BEFORE" ] &&
             [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
             git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
          base="$BEFORE"
        else
          base="$(git merge-base origin/main HEAD)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
        fi
        echo "Diff base: $(git log -1 --format='%H %s' "$base")"
        echo "BASE=$base" >> "$GITHUB_ENV"
        commissioning_base="$base"
        gap=
        if [ "$EVENT" != pull_request ] &&
           [ "$GITHUB_REF" = refs/heads/main ]; then
          if [ -z "$BEFORE" ] ||
             [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            gap="this push creates main: no earlier main to diff against"
          elif ! git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
              git fetch -q --no-tags origin "$BEFORE" || true
            if ! commissioning_base="$(git merge-base "$BEFORE" HEAD)"; then
              gap="force push: the previous main $BEFORE cannot be fetched or shares no history with HEAD"
              commissioning_base="$base"
            fi
          fi
        fi
        echo "Commissioning base: $commissioning_base${gap:+ (gap: $gap)}"
        echo "COMMISSIONING_BASE=$commissioning_base" >> "$GITHUB_ENV"
        echo "COMMISSIONING_GAP=$gap" >> "$GITHUB_ENV"

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        disk-cache: plain
        repository-cache: true
        # This job saves the Linux plain cache, the repository cache and
        # the bazelisk cache for every other Linux job.
        cache-save: ${{ github.ref == 'refs/heads/main' }}

    - name: Build
      id: build
      # The two flags write every compile's `.d` file to the output path,
      # cache hits included, for the host-include step below (as
      # tools/prepush.sh builds); the Test step repeats them so it keeps
      # this build's analysis.
      run: >-
        bazel build //... --noshow_progress --test_output=errors
        --experimental_inmemory_dotd_files=false '--remote_download_regex=.*\.d$'

    - name: No compile read a host package header
      # tools/check_host_includes.py over this build's `.d` files: a header
      # under /usr/include (or another host prefix) that is not the C
      # library's, the kernel's or the C++ standard library's compiled here
      # only because the runner has the package (tools/prepush.sh's
      # host-includes step).
      run: >-
        python3 tools/check_host_includes.py "$(bazel info
        --experimental_inmemory_dotd_files=false '--remote_download_regex=.*\.d$'
        output_path)"

    - name: Layer check (ARCHITECTURE.md "Allowed dependencies")
      # bazel query paths that must be empty; known exceptions are
      # allowlisted in the script and the list may only shrink.
      run: python3 tools/check_layers.py

    - &runfiles-collisions
      name: No runfiles path is both generated-empty and a source file
      # A reused sandbox writes an empty generated file through a stale
      # symlink left by another test's runfiles, truncating the source.
      run: python3 tools/check_runfiles_collisions.py

    - name: Checked-in Studio bindings match the telemetry_ts genrule
      # pnpm and tsc read studio/src/generated; Bazel builds Studio from the
      # //studio:telemetry_ts genrule (the same pinned flatc `pnpm generate`
      # runs). A schema edit without `pnpm generate` fails here.
      run: diff -ru bazel-bin/studio/src/generated studio/src/generated

    # Anchored and reused by macos.
    - &make-read-only
      name: Make tracked source files read-only
      # A reused Bazel sandbox once truncated talOS/python/talos/__init__.py
      # by creating a generated empty file through a stale symlink to it
      # (tools/check_runfiles_collisions.py now prevents that layout). With
      # every tracked regular file read-only, a recurrence fails as "Could
      # not copy inputs into sandbox: ... (Permission denied)" naming the
      # test, instead of corrupting the checkout. Directories stay writable
      # (Bazel's convenience symlinks); MODULE.bazel.lock stays writable.
      # tools/prepush.sh runs the same script before a push.
      run: python3 tools/make_sources_read_only.py

    - name: Allow unprivileged user namespaces
      # Ubuntu 24.04's AppArmor strips capabilities from an unprivileged
      # user namespace, so //talOS/protocol:udp_address_change_test (REQ-RT-22's
      # real-stack proof) could not create its tap device and skipped. The
      # Test step below sets TALOS_REQUIRE_NETNS=1, which fails that skip.
      # Not in the sanitizer jobs: under ThreadSanitizer, unshare in a forked
      # child of a multithreaded process is unreliable, so there it may skip.
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Test
      id: test
      # Every lane but the soak (docs/TESTING.md §9). The console is kept
      # for the failed-test step below, the build events for the lane
      # budget step. TALOS_REQUIRE_BROWSER=1 fails, rather than skips,
      # //studio:drive_browser_test if it finds no browser; the runner's
      # Google Chrome is /usr/bin/google-chrome, on the test's default PATH.
      run: |
        set -o pipefail
        bazel test //... --noshow_progress --test_output=errors \
          --experimental_inmemory_dotd_files=false '--remote_download_regex=.*\.d$' \
          --test_env=TALOS_REQUIRE_NETNS=1 \
          --test_env=TALOS_REQUIRE_BROWSER=1 \
          --build_event_json_file="$RUNNER_TEMP/test-events.json" 2>&1 \
          | tee "$RUNNER_TEMP/bazel-test.log"

    - name: Lane budgets (docs/TESTING.md §9)
      # Each test action's time against its lane's budget, from this
      # invocation's build events (a cached result keeps the time of the
      # run that produced it). The fast lane's 5 s is printed, not
      # enforced: the budgets were measured on an idle 8-core workstation,
      # where every fast target ran under 5 s, and this runner ran three
      # over it (run 43357369179: the 2026 robot's bundle_test 6.8 s and
      # pose_estimator node_test 5.6 s, when talOS held that robot, and
      # //studio:typecheck 5.6 s). TODO.md LANE-1.
      if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
      run: >-
        python3 tools/slow_tests.py --check
        --bep "$RUNNER_TEMP/test-events.json"
        --enforce heavy,integration,e2e,perf

    - &checkout-unchanged
      name: Checkout unchanged by the build and tests
      # Runs after failed tests too: a source truncation fails the tests,
      # and this is the evidence. Modified tracked files and untracked,
      # non-ignored files both fail it.
      if: ${{ !cancelled() }}
      run: |
        status="$(git status --porcelain --untracked-files=all)"
        if [ -n "$status" ]; then
          printf '%s\n' "$status"
          git diff --stat
          exit 1
        fi

    - &collect-failed-tests
      name: Collect the failed tests' logs and outputs
      # Copies each failed, timed-out or incomplete test's bazel-testlogs
      # directory (test.log, test.xml, test.outputs/, every shard), named
      # in Bazel's summary, beside the console log.
      if: ${{ failure() && steps.test.outcome == 'failure' }}
      run: |
        out="$RUNNER_TEMP/failed-tests"
        mkdir -p "$out"
        cp "$RUNNER_TEMP/bazel-test.log" "$out/" || true
        grep -oE '^//[^ ]+ +(FAILED|TIMEOUT|INCOMPLETE|NO STATUS)' \
            "$RUNNER_TEMP/bazel-test.log" | awk '{ print $1 }' | sort -u \
          | while read -r label; do
              rel="${label#//}"
              rel="${rel/://}"
              echo "$label -> $rel"
              if [ -d "bazel-testlogs/$rel" ]; then
                mkdir -p "$out/$rel"
                cp -R "bazel-testlogs/$rel/." "$out/$rel/"
              fi
            done

    - &upload-failed-tests
      name: Keep the failed tests' logs and outputs
      if: ${{ failure() && steps.test.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: testlogs-${{ env.TESTLOGS }}
        path: ${{ runner.temp }}/failed-tests/
        if-no-files-found: ignore

    # clang-tidy reuses the Bazel server and outputs of the build above, so
    # it adds only the compilation database and the analysis. It runs when
    # the build succeeded, whether or not the tests did.
    - name: Install clang-tidy
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-18

    - name: Refresh compilation database
      # Hedron's Compile Commands Extractor (already a dev_dependency in
      # MODULE.bazel) generates compile_commands.json for clang-tidy. It
      # only extracts commands; clang-tidy resolves headers through
      # bazel-out/external, including generated ones (e.g. flatbuffers
      # virtual includes), which the build above materialized.
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: bazel run @hedron_compile_commands//:refresh_all --noshow_progress

    - name: Run clang-tidy on changed sources and headers
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: python3 tools/run_clang_tidy.py "$BASE"

  sanitizers:
    name: Bazel (${{ matrix.sanitizer }}, Linux)
    # The macOS legs run in nightly.yaml.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    env:
      TESTLOGS: linux-${{ matrix.sanitizer }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ matrix.sanitizer }}
        repository-cache: true
        cache-save: ${{ github.ref == 'refs/heads/main' }}
    - name: Test instrumented suite and bounded decoder corpora
      id: test
      run: |
        set -o pipefail
        # tools/sanitizer_lane.sh, which tools/prepush.sh --full also runs,
        # so the two cannot drift; its header says what it runs.
        bash tools/sanitizer_lane.sh ${{ matrix.sanitizer }} 2>&1 \
          | tee "$RUNNER_TEMP/bazel-test.log"
    - *collect-failed-tests
    - *upload-failed-tests

  robot-repo:
    name: Repositories depending on talOS (examples/robot_repo, wrist_repo)
    # Each is its own workspace with talOS as @talos (local_path_override),
    # so talOS compiles again under external/talos+ and none of the Linux
    # job's action keys match: this job keeps its own disk cache. The
    # config fuzz test is the toml++ parser patch's regression, built as a
    # dependency (REQ-DEV-29).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: robot-repo
        repository-cache: true
        cache-save: ${{ github.ref == 'refs/heads/main' }}
    - name: Build Studio pages for dependent repositories
      # Writes bazel-bin/studio/dist (with STUDIO_STAMP.txt) so examples/robot_repo
      # exercises real HTTP 200 /drive serving (TALOS_REQUIRE_STUDIO_PAGES=1).
      run: bazel build --noshow_progress //studio:web_dist
    - name: Robot repository (graph, node and sim tests, bundle)
      working-directory: examples/robot_repo
      run: |
        bazel test --test_output=errors \
          --test_env=TALOS_REQUIRE_STUDIO_PAGES=1 \
          //... \
          @talos//talOS/configuration:config_fuzz_test
    - name: Scaffolded subsystems in a copy of the robot repository
      # new_subsystem's C++ and Python output, built and tested in a copy
      # of the robot repository with and without target coverage required,
      # and in the repository new_robot --standalone makes of it.
      run: tools/check_robot_repo_scaffold.sh
    - name: Standalone subsystem repository
      working-directory: examples/wrist_repo
      run: |
        bazel test --test_output=errors //... \
          @talos//talOS/configuration:config_fuzz_test

  macos:
    name: macOS (build, test)
    # macOS is the deployment OS: its kqueue, RTMS process-identity,
    # F_FULLFSYNC and Metal paths compile only here. A hosted runner (3
    # vCPU, shared) is no timing reference, and the full graph needs about
    # 2.5 of its cores, so the full-graph timed tests (startup,
    # match_rehearsal, accuracy) are left out here and run on Linux; the
    # macOS sanitizer legs and soak run in nightly.yaml.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TESTLOGS: macos
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: plain
        repository-cache: true
        cache-save: ${{ github.ref == 'refs/heads/main' }}

    - name: Build
      run: bazel build //... --noshow_progress --test_output=errors

    - *runfiles-collisions

    - *make-read-only

    - name: Test
      id: test
      run: |
        set -o pipefail
        bazel test --noshow_progress --test_output=errors \
          --config=no_e2e //... 2>&1 \
          | tee "$RUNNER_TEMP/bazel-test.log"

    - name: Process limits and counts after a failure
      # TODO.md INC-5: a probe whose spawn names `fork (guardian)` or `fork`
      # with EAGAIN ran out of process slots. These are the limits and what
      # is still running once the tests end, not the peak.
      if: ${{ failure() }}
      run: |
        sysctl kern.maxproc kern.maxprocperuid
        echo "ulimit -u: $(ulimit -u)"
        echo "processes: $(ps -A | wc -l)"
        echo "processes of uid $(id -u): $(ps -U "$(id -u)" | wc -l)"

    - *checkout-unchanged

    - *collect-failed-tests

    - *upload-failed-tests

  soak:
    name: Soak (Linux)
    # Pushes only, with fault-order seed 0 on topic branches and seed 1 on
    # main, so main runs an order the branches did not. The macOS soak runs
    # in nightly.yaml.
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/soak.yaml
    with:
      os: ubuntu-latest
      seed: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

  rio-adapter:
    name: RIO adapter (GradleRIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: controller_processor/rio
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Java (GradleRIO needs a JDK; the wrapper itself is pinned)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Install RoboRIO toolchain
      # buildRio cross-compiles for linuxathena, and GradleRIO refuses to
      # configure the project at all until the toolchain is installed.
      run: ./gradlew installRoboRioToolchain

    - name: Desktop adapter test
      # PhoenixBackend encoder + sim-honesty regressions in src/test/cpp:
      # the actual adapter code, compiled and run on desktop through the
      # WPILib simulation HAL. (phoenixTest is the stable aggregator the
      # build.gradle registers over the per-variant google-test run tasks
      # the testSuites block wires up.)
      run: ./gradlew phoenixTest

    - name: RoboRIO target build
      # Cross-compile the deployed frcUserProgram for linuxathena. This is
      # the artifact `deploy` ships; it never runs in CI, it must compile.
      # talOS has no built-in companion address, so -Pcompanion=<ipv4> is
      # required for every RoboRIO target build.
      run: ./gradlew buildRio -Pcompanion=10.0.0.2

    - name: Generate RoboRIO compilation database
      # Export desktop compile_commands.json for clang-tidy-18 (CI-12).
      run: ./gradlew setupCompileCommands

    - name: Install clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-18

    - name: Run clang-tidy on RoboRIO sources
      # Runs clang-tidy-18 over controller_processor/rio/src/main/cpp and
      # src/main/include against GradleRIO's desktop compilation database,
      # failing on any lint finding, missing DB/source, or compiler error.
      working-directory: .
      run: python3 tools/run_rio_clang_tidy.py

  rio-in-the-loop:
    name: RoboRIO program in the loop (WPILib sim)
    # The deployed RoboRIO program (Robot.cpp: its Driver Station loop,
    # gateway and Phoenix 6 backend) run as a desktop simulation against the
    # Bazel-built bridge and the bench's swerve module node:
    # tools/test_rio_in_the_loop.py --wpilib drives, checks the robot ends
    # neutral after the target, node, bridge and Driver Station have stopped
    # in turn, replays the node's log, checks a never-enabled robot does not
    # move, and, with the Driver Station still enabled, cuts the main
    # processor off mid-drive and checks from the RoboRIO program's own
    # States that it neutralizes every output on its first tick at or past
    # the command's expiry. -Pheadless (set by the script) loads no
    # simulation GUI, so no display is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup bazel-action
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: plain
        repository-cache: true
        cache-save: false

    - name: Setup Java (GradleRIO needs a JDK; the wrapper itself is pinned)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Build the main-processor side
      run: >-
        bazel build --noshow_progress
        //bench/main_processor/swerve_module:all
        //talOS/bridge:hardware_node

    - name: Install RoboRIO toolchain
      # GradleRIO refuses to configure the project until it is installed,
      # even for a desktop-only task.
      working-directory: controller_processor/rio
      run: ./gradlew installRoboRioToolchain

    - name: Keep the Phoenix simulation's device files in memory
      # Phoenix 6 desktop simulation rewrites each simulated device's flash
      # file (ctre_sim/*.dat, about 1250 rewrites in the 2 s after a
      # configure) while holding the lock the loop's Phoenix calls take, so
      # the loop waits as long as the runner's disk does (370 ms in run
      # 43023451199). The RoboRIO has no such files. The loop's own config
      # save (talos_config.bin) stays on disk.
      working-directory: controller_processor/rio
      run: mkdir -p /dev/shm/ctre_sim && ln -sfn /dev/shm/ctre_sim ctre_sim

    - name: Build and start the desktop simulation once
      # The test runs Gradle with --offline, so everything simulateNative
      # resolves (WPILib and Phoenix simulation natives) is fetched here.
      # The robot, disabled, stops itself after two seconds. No config is
      # pushed, so no simulated device is created here; the first configure
      # happens in the test.
      working-directory: controller_processor/rio
      env:
        TALOS_SIM_DS: '0'
        TALOS_SIM_RUN_MS: '2000'
      run: timeout 900 ./gradlew -Pheadless simulateNative

    - name: Swerve module against the RoboRIO program
      timeout-minutes: 10
      run: python3 tools/test_rio_in_the_loop.py --wpilib --output-dir "$RUNNER_TEMP/rio-in-the-loop"

    - name: Keep the failed run's logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: rio-in-the-loop
        path: ${{ runner.temp }}/rio-in-the-loop/
        if-no-files-found: ignore

  buildifier:
    name: Buildifier (changed Starlark files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The diff base step checks the whole branch on a topic-branch push.
      DIFF_SCOPE: branch
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        # Full history is needed to diff against the PR base / push base.
        fetch-depth: 0

    - name: Install buildifier
      # Version and sha256 are pinned once, in tools/setup.sh.
      run: |
        eval "$(grep -E '^BUILDIFIER_(VERSION|SHA256_amd64)=' tools/setup.sh)"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/buildifier" \
          "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION:?}/buildifier-linux-amd64"
        echo "${BUILDIFIER_SHA256_amd64:?}  $RUNNER_TEMP/buildifier" | sha256sum -c -
        install -m 0755 "$RUNNER_TEMP/buildifier" /usr/local/bin/buildifier
        buildifier --version

    - *diff-base

    - name: Check changed Starlark files
      run: |
        # Check mode only: never rewrites files. Scoped to the files changed
        # since $BASE so pre-existing tree state stays untouched.
        git diff --name-only --diff-filter=d -z "$BASE" HEAD -- \
          'BUILD' 'BUILD.bazel' '*/BUILD' '*/BUILD.bazel' '*.bzl' \
          'MODULE.bazel' '*/MODULE.bazel' \
          | xargs -0 -r buildifier --mode=check --lint=warn

  clang-format:
    name: clang-format (changed C++ files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The diff base step checks the whole branch on a topic-branch push.
      DIFF_SCOPE: branch
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-18

    - *diff-base

    - name: Check changed C/C++ files
      run: |
        # --dry-run --Werror: check only, never reformats. .clang-format at
        # the repo root is picked up automatically. third_party/ is vendored
        # upstream source (metal-cpp) and keeps its upstream formatting.
        git diff --name-only --diff-filter=d -z "$BASE" HEAD -- \
          '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/' \
          | xargs -0 -r clang-format-18 --dry-run --Werror

  lint:
    name: Source lints (no Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The diff base step checks the whole branch on a topic-branch push,
      # so the commissioning lint checks every commit the branch adds.
      DIFF_SCOPE: branch
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        # Full history: the commissioning lint reads each commit since
        # $COMMISSIONING_BASE.
        fetch-depth: 0

    - *diff-base

    - name: Test time, links, requirement trace, node test matrix, deps, commissioning
      # tools/source_lints.sh, which tools/prepush.sh's source-lints step
      # also runs, so the two cannot drift; its header lists each lint. It
      # runs every lint whatever the others find and prints one line per
      # lint. The commissioning lint takes COMMISSIONING_BASE; a
      # COMMISSIONING_GAP (no base covers every pushed commit) fails the job.
      run: |
        status=0
        bash tools/source_lints.sh --base "$COMMISSIONING_BASE" || status=1
        if [ -n "$COMMISSIONING_GAP" ]; then
          echo "::error::commissioning: not every pushed commit was checked: $COMMISSIONING_GAP"
          status=1
        fi
        exit "$status"

  gate:
    name: CI gate
    # The one check to require: it fails unless every job above succeeded.
    # Only the soak may be skipped (it runs on pushes, not pull requests).
    # A cancelled run skips it rather than passing it.
    if: ${{ !cancelled() }}
    needs:
      - linux
      - sanitizers
      - robot-repo
      - macos
      - soak
      - rio-adapter
      - rio-in-the-loop
      - buildifier
      - clang-format
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every required job passed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'EOF'
        import json, os, sys
        may_skip = {'soak'}
        failed = False
        for job, need in sorted(json.loads(os.environ['NEEDS']).items()):
            result = need['result']
            ok = result == 'success' or (result == 'skipped' and job in may_skip)
            failed |= not ok
            print(f"{job}: {result}{'' if ok else '  <- not passed'}")
        sys.exit(1 if failed else 0)
        EOF
