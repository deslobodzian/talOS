# Config for //talOS/node:test_node, the binary the describe and replay tests
# run. Single-file layout. The node owns no hardware; the robot config still
# needs one motor somewhere to validate, so a neighbouring subsystem has it.
[robot]
period_us = 5000
command_timeout_us = 100000

[subsystems.test_node]
period_us = 10000
step = 3

[subsystems.mechanism.motors.unused]
can_id = 1
