# A shooter rig welded to the carpet: a hopper with a gate feeder on its own
# roller motor and a flywheel (README.md). Every number is an estimate unless
# marked. A starting point: copy it beside a robot's config and change it.

[robot]
name = "shooter_rig"
root = "welded"
mass_kg = 40.0

[game_piece]
radius_m = 0.07506  # the 2026 FUEL (fields/rebuilt_2026/README.md)

[frame]
length_m = 0.6985
width_m = 0.6985
belly_clearance_m = 0.035
rail_height_m = 0.0508
rail_width_m = 0.0254

[bumpers]
bottom_m = 0.0635
height_m = 0.127
thickness_m = 0.085

[motors.roller]
gear = 1.0
rotor_inertia_kg_m2 = 1.0e-4

[motors.flywheel]
gear = 1.0
rotor_inertia_kg_m2 = 1.0e-4

[hopper]
width_m = 0.56
floor_front_m = 0.20
floor_slope_deg = 12.0
wall_top_m = 0.70

[feeder]
motor = "roller"
x_m = -0.12
roller_radius_m = 0.0254
roller_mass_kg = 0.3
compression_m = 0.01

[flywheel]
motor = "flywheel"
radius_m = 0.0508
width_m = 0.12
mass_kg = 0.8
inertia_kg_m2 = 0.0025
axle_x_m = -0.336
axle_z_m = 0.55
compression_m = 0.02
hood_start_deg = -20.0
exit_elevation_deg = 60.0
exit_offset_m = 0.15
efficiency = 0.5

# Across the hopper where a FUEL waits against the feeder, at its centre.
[[beam_breaks]]
name = "intake_beam"
position_m = [-0.06, -0.27, 0.195]
direction = [0.0, 1.0, 0.0]
cutoff_m = 0.54

# Across the pocket behind the feeder, at a FUEL centre's height.
[[beam_breaks]]
name = "beam_break"
position_m = [-0.21776, -0.27, 0.18]
direction = [0.0, 1.0, 0.0]
cutoff_m = 0.54

# Eight FUEL in the hopper: two rows of three on the floor in front of the
# feeder, two more resting on them, each 5 mm or more clear of what it meets.
[preload]
positions_m = [
  [-0.015, -0.16, 0.211],
  [-0.015, 0.0, 0.211],
  [-0.015, 0.16, 0.211],
  [0.145, -0.16, 0.245],
  [0.145, 0.0, 0.245],
  [0.145, 0.16, 0.245],
  [0.065, -0.08, 0.353],
  [0.065, 0.08, 0.353],
]
