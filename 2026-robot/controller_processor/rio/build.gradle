import org.gradle.internal.os.OperatingSystem
import org.gradle.language.cpp.tasks.CppCompile

// The RoboRIO program is deliberately small: a Driver Station loop and the
// hardware gateway. Everything else in talOS builds with Bazel, and the tests
// for the gateway live there (//talOS/hardware:gateway_test). The GradleRIO
// tests (src/test/cpp) cover only this program's own sources: desktop
// simulation regressions for the Phoenix backend, the config store, the
// simulated Driver Station, the logger, the companion link reporter, the
// loop watchdog and the loop's wake schedule; there is no command-based
// framework.
plugins {
    id "cpp"
    id "google-test"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcCpp(getArtifactTypeClass('FRCNativeArtifact')) {
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcCpp

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Set to true to run simulation in debug mode
wpi.cpp.debugSimulation = false

// The simulation GUI is the only way to enable the robot and choose Teleoperated
// when no real Driver Station is attached, so an interactive `simulateNative`
// gets it. Automated runs pass -Pheadless and drive the Driver Station through
// the TALOS_SIM_DS* environment variables instead; see
// src/main/include/SimDriverStation.h.
if (!project.hasProperty("headless")) {
    wpi.sim.addGui().defaultEnabled = true
}
wpi.sim.addDriverstation()

nativeUtils.platformConfigs.named("linuxathena").configure {
    it.cppCompiler.args.add('-Wall')
    it.cppCompiler.args.add('-Wextra')
    it.cppCompiler.args.add('-pedantic')
    it.cppCompiler.args.add('-Werror')
    it.cppCompiler.args.add('-Wno-unused-parameter')
}

if (OperatingSystem.current().isWindows()) {
    nativeUtils.platformConfigs.named(wpi.platforms.desktop).configure {
        it.cppCompiler.args.add('/W3')
        it.cppCompiler.args.add('/WX')
        it.linker.args.add('Ws2_32.lib')
    }
} else {
    nativeUtils.platformConfigs.named(wpi.platforms.desktop).configure {
        it.cppCompiler.args.add('-Wall')
        it.cppCompiler.args.add('-Wextra')
        it.cppCompiler.args.add('-pedantic')
        it.cppCompiler.args.add('-Werror')
        it.cppCompiler.args.add('-Wno-unused-parameter')
        if (OperatingSystem.current().isMacOsX()) {
            // Apple clang 21 warns inside WPILib's bundled gtest-printers.h
            // (char8_t -> char32_t); older clangs do not know the flag.
            it.cppCompiler.args.add('-Wno-unknown-warning-option')
            it.cppCompiler.args.add('-Wno-character-conversion')
        }
    }
}

if (project.hasProperty("asan")) {
    nativeUtils.platformConfigs.named("linuxx86-64").configure {
        it.cppCompiler.args.add('-g3')
        it.cppCompiler.args.add('-fsanitize=address')
        it.linker.args.add('-fsanitize=address')
    }
}

if (project.hasProperty("tsan")) {
    nativeUtils.platformConfigs.named("linuxx86-64").configure {
        it.cppCompiler.args.add('-g3')
        it.cppCompiler.args.add('-fsanitize=thread')
        it.linker.args.add('-fsanitize=thread')
    }
}

if (project.hasProperty("ubsan")) {
    nativeUtils.platformConfigs.named("linuxx86-64").configure {
        it.cppCompiler.args.add('-g3')
        it.cppCompiler.args.add('-fsanitize=undefined')
        it.linker.args.add('-fsanitize=undefined')
    }
}

// The companion (main processor) address the program sends State to and
// accepts frames from: -Pcompanion=<IPv4 literal> on the command line of
// deploy or buildRio, 10.56.87.11 without it. It is fixed in the binary,
// never learned from a datagram, because the gateway's connected socket is
// what keeps every other host on the network from commanding the robot
// (talOS/protocol/README.md).
//
// Only the command line may set it. Gradle would also take it from
// ~/.gradle/gradle.properties, a project gradle.properties or
// ORG_GRADLE_PROJECT_companion, where a bench address would silently carry
// into a later competition deploy from the same laptop; those fail the build.
// A present but empty value (a bare -Pcompanion, or -Pcompanion=$UNSET) fails
// too rather than falling back to the default.
//
// The value must be one RuntimeUdpPeer::Open can connect to and send to on
// the RoboRIO, so the build stops here instead of every socket open failing
// or every State going nowhere: a dotted IPv4 literal in inet_pton's form
// (four decimal octets, no leading zeros), not in 0.0.0.0/8 ("this network",
// 0.0.0.0 refused by Open), 127.0.0.0/8 (loopback, the RoboRIO itself) or
// 224.0.0.0/3 (multicast, reserved, and the broadcast 255.255.255.255, whose
// connect fails with EACCES on every retry).
def companionFromCommandLine = gradle.startParameter.projectProperties.containsKey('companion')
if (project.hasProperty('companion') && !companionFromCommandLine) {
    throw new GradleException(
            "companion=${project.property('companion')} is set outside the command line " +
            "(gradle.properties or ORG_GRADLE_PROJECT_companion); remove it there: the " +
            "RoboRIO companion address is accepted only as -Pcompanion=<ipv4> on the command " +
            "line, so a bench address cannot persist into another deploy")
}
def companionAddress = companionFromCommandLine ?
        gradle.startParameter.projectProperties['companion'].toString() : '10.56.87.11'
def companionRefusal = { String text ->
    if (text.isEmpty()) return 'it is empty (a bare -Pcompanion, or an unset variable)'
    def octets = text.split('\\.', -1)
    if (octets.length != 4 ||
            !octets.every { it ==~ /0|[1-9][0-9]{0,2}/ && it.toInteger() <= 255 }) {
        return 'it is not a dotted IPv4 literal such as 10.56.87.11 (the RoboRIO program ' +
                'resolves no hostname; no leading zeros)'
    }
    def first = octets[0].toInteger()
    if (first == 0) return 'it is in 0.0.0.0/8, which names no host'
    if (first == 127) return 'it is a loopback address, the RoboRIO itself'
    if (first >= 224) return 'it is a multicast, reserved or broadcast address'
    return null
}
def refusal = companionRefusal(companionAddress)
if (refusal != null) {
    throw new GradleException("-Pcompanion=${companionAddress} refused: ${refusal}")
}
logger.quiet("RoboRIO companion address built in: ${companionAddress}" +
        (companionFromCommandLine ? ' (from -Pcompanion)' :
                ' (default, the robot network; -Pcompanion=<ipv4> to change)'))

// The build this program reports in every State (talOS/hardware/messages.h,
// GatewayBuild): RioBuild.h, written before any compile, holds the git commit
// of this checkout and whether it has uncommitted changes, untracked files
// included (the rule tools/workspace_status.sh applies to the main
// processor). Without git, or outside a git checkout, the commit is "unknown"
// and the program reports revision 0. It reads only the local repository, so
// --offline builds get it too. The header also holds the companion address
// above: a generated constant rather than a -D define, so no compiler's
// quoting of a string define is involved. The task runs every build but
// rewrites the header only when its text changes, so an unchanged checkout
// and address recompile nothing, and a changed address recompiles Robot.cpp.
def rioBuildHeaderDir = layout.buildDirectory.dir('generated/talos/include').get().asFile
def runGit = { List<String> args ->
    try {
        def process = (['git', '-C', projectDir.absolutePath] + args).execute()
        def out = new StringBuilder()
        def err = new StringBuilder()
        process.waitForProcessOutput(out, err)
        return process.exitValue() == 0 ? out.toString().trim() : null
    } catch (IOException ignored) {
        return null
    }
}

tasks.register("generateRioBuild") {
    description = 'Write the checkout\'s git commit, dirty flag and companion address to RioBuild.h'
    group = 'build'
    def header = new File(rioBuildHeaderDir, 'RioBuild.h')
    inputs.property('companion', companionAddress)
    outputs.file(header)
    outputs.upToDateWhen { false }
    doLast {
        def head = runGit(['rev-parse', 'HEAD'])
        def commit = head != null && head ==~ /[0-9a-f]{16,}/ ? head : 'unknown'
        // A status that cannot be read is not evidence of a clean tree.
        def status = commit == 'unknown' ? '' : runGit(['--no-optional-locks', 'status', '--porcelain'])
        def dirty = status == null || !status.isEmpty()
        def revision = commit == 'unknown' ? '0' : "0x${commit.substring(0, 16)}"
        def text = """\
// Generated by build.gradle's generateRioBuild task; do not edit.
#pragma once

#include <cstdint>

namespace talos::rio {
// The git commit this program was built from, or "unknown".
inline constexpr const char* kBuildCommit = "${commit}";
// Its first 16 hex digits as one number, 0 when unknown
// (hardware::GatewayBuild::revision).
inline constexpr uint64_t kBuildRevision = ${revision}ull;
// Built with uncommitted changes, untracked files included.
inline constexpr bool kBuildDirty = ${dirty};
// The companion (main processor) this program sends State to and accepts
// frames from, set by -Pcompanion at build time.
inline constexpr const char* kCompanionAddress = "${companionAddress}";
}  // namespace talos::rio
"""
        if (!header.exists() || header.text != text) {
            header.parentFile.mkdirs()
            header.text = text
        }
    }
}

tasks.withType(CppCompile).configureEach {
    dependsOn 'generateRioBuild'
}

model {
    components {
        frcUserProgram(NativeExecutableSpec) {
            targetPlatform wpi.platforms.roborio
            if (includeDesktopSupport) {
                targetPlatform wpi.platforms.desktop
            }
            sources.cpp {
                source {
                    srcDir 'src/main/cpp'
                    srcDir '../../../talOS/protocol'
                    srcDir '../../../talOS/hardware'
                    srcDir '../../../talOS/driver_station'
                    // Only the gateway-side translation units; the rest of
                    // those packages (tests, sims, companion-side nodes)
                    // builds with Bazel.
                    include '**/*.cpp', 'frame.cc', 'udp.cc', 'config.cc',
                            'messages.cc', 'gateway.cc', 'driver_station.cc'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                    srcDir '../../../talOS'
                    srcDir rioBuildHeaderDir
                    include '**/*.h', '**/*.hpp'
                }
            }

            // Set deploy task to deploy this component
            deployArtifact.component = it

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            // Enable simulation for this component
            wpi.sim.enable(it)
            // Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
    testSuites {
        // Desktop tests of this program's sources (src/test/cpp): the
        // PhoenixBackend simulation regressions, ConfigStore,
        // SimDriverStation, RioLog, CompanionLink, LoopWatchdog, SocketRetry
        // and LoopSchedule.
        // The suite itself is auto-created per component by the google-test
        // plugin; this only points it at our sources and dependencies.
        frcUserProgramTest {
            sources.cpp {
                source {
                    srcDir 'src/test/cpp'
                    include '**/*.cpp'
                }
            }
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.deps.googleTest(it)
        }
    }
}

tasks.register("buildRio") {
    description = 'Build release for RoboRIO only'
    group = 'build'
    dependsOn 'frcUserProgramLinuxathenaReleaseExecutable'
}

// Stable entry point for the desktop tests in src/test/cpp (PhoenixBackend
// simulation regressions, ConfigStore, SimDriverStation, RioLog,
// CompanionLink, LoopWatchdog, SocketRetry, LoopSchedule). The google-test
// plugin creates one RunTestExecutable task per desktop variant
// (runFrcUserProgramTest<Platform><BuildType>GoogleTestExe),
// so CI pins this aggregator instead of a platform-specific variant name.
tasks.register("phoenixTest") {
    description = 'Run the RoboRIO program desktop tests (PhoenixBackend sim, ConfigStore, SimDriverStation, RioLog, CompanionLink, LoopWatchdog, SocketRetry, LoopSchedule)'
    group = 'verification'
    def runTasks = tasks.matching { it.name.startsWith('runFrcUserProgramTest') }
    dependsOn runTasks
    doFirst {
        if (runTasks.empty) {
            throw new RuntimeException('phoenixTest: no frcUserProgramTest run tasks found')
        }
    }
}

tasks.register("setupCompileCommands") {
    description = 'Generate and copy compile_commands.json to project root'
    group = 'ide'

    dependsOn 'generateCompileCommands'

    doLast {
        def filePath = ""
        if (OperatingSystem.current().isWindows()) {
            filePath = "build/TargetedCompileCommands/windowsx86-64debug"
        } else if (OperatingSystem.current().isMacOsX()) {
            filePath = "build/TargetedCompileCommands/osxuniversalrelease"
        } else if (OperatingSystem.current().isLinux()) {
            // Todo:
        }

        copy {
            from fileTree(filePath).include('compile_commands.json')
            into projectDir
        }
    }
}
