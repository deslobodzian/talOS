# Standalone policy/config fixture; independent of competition wiring.
# slot0 stays all-zero here like the real config: untuned on purpose, so
# tests exercise the demand path rather than any particular tune.
[subsystem]
name = "intake"
period_us = 20000

[motors.roller]
type = "TalonFX"
bus = "test"
can_id = 1
slot0 = { p = 0.0, i = 0.0, d = 0.0, s = 0.0, v = 0.0, a = 0.0, g = 0.0 }

[digital_inputs.intake_beam]
dio = 0
