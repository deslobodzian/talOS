# Intake subsystem. Parsed via the [[subsystems]] manifest in
# 2026-robot/main_processor/configuration/robot.toml and merged with the other
# subsystem files into one canonical view before validation.
#
# STUDENT NOTE -- where the motor's behavior lives:
#   asked speeds ..................... this file ([[teleop.bindings]] below)
#   beam-break stopping .............. main_processor/intake/intake.py
#   gains + limits (below) ............ this file ([motors.roller])
# The node asks for velocity and the motor's onboard PID closes the loop, so
# these gains decide whether the wheel actually reaches the asked speed.
[subsystem]
name = "intake"
node = "//2026-robot/main_processor/intake:node"
period_us = 20000

[motors.roller]
type = "TalonFX"
bus = "rio"
can_id = 10
# Direction + stopping: flip `inverted` if positive demand ejects instead of
# intaking; `brake` holds the wheel at stop, coast lets it spin down freely.
inverted = false
brake = true
# Current limits (amps): the first things to lower if the mechanism stalls
# and browns out, the last things to raise for more pushing power.
supply_limit_a = 40.0
stator_limit_a = 80.0
# Electrical + mechanical scaling. sensor_to_mechanism_ratio converts rotor
# revs to wheel revs (1.0 = direct drive); max_velocity_rps caps what the
# node may ask for no matter what its target lane asks.
max_voltage = 12.0
sensor_to_mechanism_ratio = 1.0
max_velocity_rps = 100.0
# Velocity-loop starting gains (slot 0, selected by intake.py).
# Commission under load: tune v for steady-state tracking, then p for response.
slot0 = { p = 0.1, i = 0.0, d = 0.0, s = 0.0, v = 0.12, a = 0.0, g = 0.0 }

[digital_inputs.intake_beam]
dio = 1

# Held button asks for 30 wheel rps (below the 100 rps motor limit).
# Positive asks stop at the beam; negative asks eject at their asked speed.
[[teleop.bindings]]
button = 2
while_held = { roller_velocity_rps = 30.0 }
