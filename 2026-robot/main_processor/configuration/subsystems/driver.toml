# Teleop driver node: chassis stick scaling, deadband, field-oriented drive.
[subsystem]
name = "driver"
node = "//2026-robot/main_processor/driver:node"
period_us = 20000
max_linear_mps = 4.0
max_angular_radps = 6.0
deadband_frac = 0.05
# Field-relative translation stops without a fresh drivetrain heading.
# Recovery requires fresh heading plus centred translation sticks.
field_oriented = true
# Button numbers are 1-based; a non-positive value disables re-zero.
rezero_button_id = 1
# Angular correction in rad/s per radian of wrapped heading error.
heading_hold_radps = 4.0
