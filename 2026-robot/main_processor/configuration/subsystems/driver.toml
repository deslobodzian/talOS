# Teleop driver node: chassis stick scaling, deadband, field-oriented drive.
[subsystem]
name = "driver"
node = "//2026-robot/main_processor/driver:node"
period_us = 20000
max_linear_mps = 4.0
max_angular_radps = 6.0
deadband_frac = 0.05
# Stick is field-relative; falls back to robot-relative until the drivetrain
# publishes a heading on /drivetrain/state.
field_oriented = true
