# Teleop bindings: chassis stick scaling plus shooter/intake button mappings.
# Game logic lives here, not in the driver_station node.
[subsystem]
name = "operator_interface"
node = "//2026-robot/main_processor/operator_interface:node"
period_us = 20000
max_linear_mps = 4.0
max_angular_radps = 6.0
deadband = 0.05
shooter_target_rps = 60.0
# Stick is field-relative; falls back to robot-relative until the drivetrain
# publishes a heading on /drivetrain/state.
field_oriented = true
# Joystick 0 buttons, 1-based as the Driver Station numbers them.
shoot_button = 1
intake_target_rps = 30.0
intake_button = 2
