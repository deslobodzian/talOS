# Shooter subsystem. Parsed via the [[subsystems]] manifest in
# 2026-robot/main_processor/configuration/robot.toml and merged with the other
# subsystem files into one canonical view before validation.
[subsystem]
name = "shooter"
node = "//2026-robot/main_processor/shooter:node"
period_us = 5000

# VelocityMechanism readiness (talOS/mechanisms/README.md "VelocityMechanism").
[flywheel]
# Readiness enters after this many consecutive 5 ms ticks within the entry
# band of the demand clamped to motors.flywheel.max_velocity_rps.
at_speed_entry_rps = 2.0
at_speed_entry_tick_count = 3
# Once ready, allow a shot-induced dip up to max(entry band, this fraction
# of |clamped demand|). Larger errors require a new consecutive-tick entry.
at_speed_exit_frac = 0.1
# Readiness clears immediately on a target change > 0.001 rps (even if both
# targets clamp equally), release/staleness, disable, motor disconnect, or
# a velocity sample older than two status periods at its State.

[motors.flywheel]
type = "TalonFX"
bus = "rio"
can_id = 9
inverted = false
brake = false
supply_limit_a = 40.0
stator_limit_a = 80.0
max_voltage = 12.0
sensor_to_mechanism_ratio = 1.0
max_velocity_rps = 100.0
cruise_velocity_rps = 80.0
acceleration_rps2 = 160.0
slot0 = { p = 0.1, i = 0.0, d = 0.0, s = 0.0, v = 0.12, a = 0.0, g = 0.0 }

[digital_inputs.beam_break]
dio = 0

[[teleop.bindings]]
button = 1
while_held = { target_velocity_rps = 60.0 }
