[robot]
name = "comp"
period_us = 5000
command_timeout_us = 100000
status_hz = 200.0
commissioned = false
sim_gateway = "//2026-robot/main_processor/simulation:sim_gateway"

# Deployment addressing: where the controller processor (RoboRIO gateway)
# lives as seen from this companion. Loopback for simulation; on a real robot
# set this to the RIO address (e.g. "10.56.87.2") or pass launcher
# --remote ADDR (the CLI flag wins). Ports follow the runtime contract:
# 5802 on the gateway, 5803 on the companion.
controller_address = "127.0.0.1"
controller_port = 5802
local_port = 5803

# Sim-session viewer. Studio's bridge is a host-side process, not a robot
# node, so it is not a [[subsystems]] entry. The launcher starts and
# supervises it when asked (--start-studio-bridge, which sim.sh passes unless
# --no-studio) and carries it in the declared graph. The watched topic is not
# repeated here: the bridge reads [subsystems.telemetry] topic, the same key
# the telemetry node reads. All keys optional; shown values are the defaults.
[studio]
bridge = "//studio/bridge:studio_bridge"
http_port = 5800
webroot = "bazel-bin/studio/dist"

# Subsystem manifest. Each entry names one subsystem and the file holding its
# config, pathed relative to this file; an optional `node = "//pkg:target"`
# overrides the file's own `node` label. The parser merges every listed file
# into one canonical view BEFORE validating, so exclusive-ownership and
# deterministic (subsystem, device) id ordering behave exactly as one file.
# Manifest order is irrelevant: logical ids sort by (subsystem, device) name.
[[subsystems]]
name = "arbiter"
path = "subsystems/arbiter.toml"

[[subsystems]]
name = "drivetrain"
path = "subsystems/drivetrain.toml"

[[subsystems]]
name = "intake"
path = "subsystems/intake.toml"

[[subsystems]]
name = "odometry"
path = "subsystems/odometry.toml"

[[subsystems]]
name = "operator_interface"
path = "subsystems/operator_interface.toml"

[[subsystems]]
name = "shooter"
path = "subsystems/shooter.toml"

[[subsystems]]
name = "telemetry"
path = "subsystems/telemetry.toml"
