[robot]
name = "comp"
period_us = 5000
command_timeout_us = 100000
status_hz = 200.0
commissioned = false
sim_gateway = "//2026-robot/main_processor/drivetrain:sim_gateway"

# Subsystem manifest. Each entry names one subsystem node and the file holding
# its config, pathed relative to this file. The parser merges every listed
# file into one canonical view BEFORE validating, so exclusive-ownership and
# deterministic (subsystem, device) id ordering behave exactly as one file.
# Manifest order is irrelevant: logical ids sort by (subsystem, device) name.
[[subsystems]]
name = "arbiter"
path = "../arbiter/subsystem.toml"

[[subsystems]]
name = "drivetrain"
path = "../drivetrain/subsystem.toml"

[[subsystems]]
name = "driver_station"
path = "../driver_station/subsystem.toml"

[[subsystems]]
name = "odometry"
path = "../odometry/subsystem.toml"

[[subsystems]]
name = "operator_interface"
path = "../operator_interface/subsystem.toml"

[[subsystems]]
name = "shooter"
path = "../shooter/subsystem.toml"

[[subsystems]]
name = "telemetry"
path = "../telemetry/subsystem.toml"
