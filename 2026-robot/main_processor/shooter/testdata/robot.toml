# Local shooter fixture. Device IDs are assigned by the normal parser. The
# neighbor's motor stays connected, so a disconnected flywheel is the loss of
# one device, as on a robot, not of all feedback (which the gateway and
# SimHardware answer with a fault).
[robot]
name = "shooter_test"
period_us = 5000
command_timeout_us = 100000
status_hz = 200.0
commissioned = false

[[subsystems]]
name = "shooter"
path = "shooter.toml"

[[subsystems]]
name = "neighbor"
path = "neighbor.toml"
