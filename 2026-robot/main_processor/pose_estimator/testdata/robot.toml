# Pose estimator test robot: the estimator alone, two cameras, the 2026
# robot's module layout. node_test.py builds its Sim configs the same way,
# one per backend.
[robot]
name = "pose_estimator_test"
period_us = 20000
command_timeout_us = 100000

[subsystems.pose_estimator]
period_us = 20000
backend = "factor_graph"
cameras = ["front_camera", "back_camera"]

# The estimator reads the module offsets from the drivetrain's geometry. A
# robot config needs one motor; the drivetrain whose state the estimator reads
# owns it. The tests publish /drivetrain/state themselves.
[subsystems.drivetrain.geometry]
modules = [
  { x_m = -0.30, y_m = 0.30 },
  { x_m = -0.30, y_m = -0.30 },
  { x_m = 0.30, y_m = 0.30 },
  { x_m = 0.30, y_m = -0.30 },
]

[subsystems.drivetrain.motors.front_left_drive]
type = "TalonFX"
bus = "test"
can_id = 1
