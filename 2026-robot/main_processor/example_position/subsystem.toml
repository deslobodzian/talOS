# Lift shelf subsystem. Closed-loop position for one 25:1 geared stage.
#
# STUDENT NOTE -- where the mechanism's behavior lives:
#   shelf ask ........................ example_position/position_example.py
#   position -> command bytes ........ position_example.encode_position
#   gains + gearing + limits (below). this file ([motors.lift])
# The node asks for mechanism rotations and the Talon's onboard PID
# (slot 0) closes the loop rotor-side of the gearbox, so the ratio below
# is where the two frames meet (see talos_nodes/intake/units.py).
[subsystem]
name = "lift_shelf"
node = "//2026-robot/main_processor/example_position:position_example"
period_us = 20000

[motors.lift]
type = "TalonFX"
bus = "rio"
can_id = 11
# Direction: flip `inverted` if positive demand drives the stage down.
inverted = false
# A lift must hold position at stop, never coast.
brake = true
# Current limits (amps): a move that trips these stalls short of the
# shelf -- fix the limits/gains, never just raise the timeout.
supply_limit_a = 40.0
stator_limit_a = 80.0
max_voltage = 12.0
# Gearing point: 25 rotor rotations per ONE mechanism (wheel) rotation.
# Verify FIRST (command 1 mechanism rotation, confirm one wheel turn): a
# wrong ratio multiplies every later mistake by 25.
sensor_to_mechanism_ratio = 25.0
# Cruise clamp (mechanism rev/s): long moves slew here; short moves never
# touch it. Clamp the demand to the shelf range (see clamp_demand in the
# example) so a sign error cannot drive through the hard stop.
max_velocity_rps = 4.0
# Position-loop gains (slot 0, selected by SLOT in the example): s breaks
# the stage loose, v carries steady motion, p trims the arrival. Tune in
# that order; g only if the stage sags holding position.
slot0 = { p = 0.5, i = 0.0, d = 0.0, s = 0.2, v = 0.3, a = 0.0, g = 0.0 }
