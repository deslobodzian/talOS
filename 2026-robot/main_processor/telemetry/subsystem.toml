# 2026-game telemetry mechanism channels: shooter state plus the intake
# Studio view (requested speed, measured speed, inhibit reason) forwarded
# into the platform core's Studio frame. Pose/chassis/driver-station
# channels and the feed topic live in the platform core (talos-telemetry/);
# game logic lives here, not in the telemetry core.
[subsystem]
name = "telemetry"
node = "//2026-robot/main_processor/telemetry:node"
period_us = 10000
topic = "/talos/telemetry"
