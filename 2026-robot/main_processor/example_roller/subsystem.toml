# Roller bring-up subsystem. Open-loop checkout for one direct-drive wheel.
#
# STUDENT NOTE -- where the roller's behavior lives:
#   volts ask ...................... example_roller/roller_example.py (run_sim)
#   volts -> command bytes ......... roller_example.encode_voltage (MODE_VOLTAGE)
#   limits + gains (below) ......... this file ([motors.roller])
# Open loop sends volts straight to the motor leads: the Talon closes no
# loop, so every gain stays zero and that is CORRECT (compare the tuned
# slot0 in ../example_flywheel/subsystem.toml for the closed-loop case).
[subsystem]
name = "roller_bringup"
node = "//2026-robot/main_processor/example_roller:roller_example"
period_us = 20000

[motors.roller]
type = "TalonFX"
bus = "rio"
can_id = 10
# Direction + stopping: flip `inverted` if positive volts spin the wheel
# the wrong way; `brake` holds at 0 V, coast lets it spin down freely.
inverted = false
brake = true
# Current limits (amps): lower first if a stall browns out the bus.
supply_limit_a = 40.0
stator_limit_a = 80.0
# Electrical scaling: max_voltage (volts at the leads) is the boundary
# units.check_volts enforces -- asks beyond +/- it raise before motion.
max_voltage = 12.0
# Direct drive: 1 rotor rotation per 1 wheel rotation, so rotor and
# mechanism frames agree (see talos_nodes/intake/units.py).
sensor_to_mechanism_ratio = 1.0
max_velocity_rps = 100.0
# UNTUNED BY DESIGN: open loop has no PID, so all zeros. If a later
# closed-loop step needs gains, tune v first until measured ~= requested.
slot0 = { p = 0.0, i = 0.0, d = 0.0, s = 0.0, v = 0.0, a = 0.0, g = 0.0 }
