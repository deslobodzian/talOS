# PositionPy test robot: one motor homed on one switch, and a neighbor.
# The neighbor subsystem's motor stays connected: losing the node's motor
# is one device lost, as on a robot, which only the node's own feedback
# gate stops. Losing every motor and CAN sensor is the gateway's fault.
[robot]
name = "position_py_test"
period_us = 20000
command_timeout_us = 100000

[subsystems.position_py.position_py]
tolerance_rot = 0.05
min_rot = 0.0
max_rot = 100.0
homing = "limit_switch"
limit_switch = "position_py_home"
homing_v = -1.0
homing_timeout_us = 500000
homing_stall_rps = 0.1
homing_stall_us = 200000
home_margin_rot = 0.5

[subsystems.position_py.motors.position_py]
type = "TalonFX"
bus = "test"
can_id = 1
position_frame = "rezero"
slot0 = { p = 0.0, i = 0.0, d = 0.0, s = 0.0, v = 0.0, a = 0.0, g = 0.0 }

[subsystems.position_py.digital_inputs.position_py_home]
dio = 0

[subsystems.neighbor.motors.wheel]
type = "TalonFX"
bus = "test"
can_id = 2
