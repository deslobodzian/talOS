# PositionPy test robot: one subsystem, one motor homed on one switch.
[robot]
name = "position_py_test"
period_us = 20000
command_timeout_us = 100000

[subsystems.position_py]
max_position_rot = 100.0
homing_v = -1.0
homing_timeout_us = 500000
homing_stall_rps = 0.1
homing_stall_us = 200000
home_margin_rot = 0.5

[subsystems.position_py.motors.position_py_motor]
type = "TalonFX"
bus = "test"
can_id = 1
requires_zero = true
slot0 = { p = 0.0, i = 0.0, d = 0.0, s = 0.0, v = 0.0, a = 0.0, g = 0.0 }

[subsystems.position_py.digital_inputs.position_py_home]
dio = 0
