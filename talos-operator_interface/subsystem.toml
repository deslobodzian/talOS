# Chassis stick mapping: scaling, deadband and field-oriented toggle. This core
# is game-agnostic; year mechanism bindings live in
# 2026-robot/main_processor/operator_interface/.
[subsystem]
name = "operator_interface"
node = "//:node"
period_us = 20000
max_linear_mps = 4.0
max_angular_radps = 6.0
deadband = 0.05
# Stick is field-relative; falls back to robot-relative until the drivetrain
# publishes a heading on /drivetrain/state, and back again when the last
# heading is older than heading_timeout_s.
field_oriented = true
heading_timeout_s = 0.1
