import groovy.json.JsonSlurper
import org.gradle.internal.os.OperatingSystem
import org.gradle.language.cpp.tasks.CppCompile

// The RoboRIO program is deliberately small: a Driver Station loop and the
// hardware gateway. Everything else in talOS builds with Bazel, and the tests
// for the gateway live there (//talOS/hardware:gateway_test). The GradleRIO
// tests (src/test/cpp) cover only this program's own sources: desktop
// simulation regressions for the Phoenix backend, the config store, the
// simulated Driver Station, the Driver Station reader, the logger, the
// companion link reporter, the loop watchdog, the loop's wake schedule, the
// loop's Driver Station generations and packet cadence and the loop's console
// lines;
// there is no command-based framework.
plugins {
    id "cpp"
    id "google-test"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// Team number: talOS has no built-in team number. For deploy tasks, supply
// -PteamNumber=<team> on the command line or provide "teamNumber" in
// .wpilib/wpilib_preferences.json (forwarded by
// `bazel run @talos//controller_processor/rio:gradlew` from a robot
// repository). Desktop tasks (phoenixTest, simulateNative) and buildRio need
// no team number.
def teamFromCommandLine = gradle.startParameter.projectProperties.containsKey('teamNumber')
if (project.hasProperty('teamNumber') && !teamFromCommandLine) {
    throw new GradleException(
            "teamNumber=${project.property('teamNumber')} is set outside the command line " +
            '(gradle.properties or ORG_GRADLE_PROJECT_teamNumber); remove it there: ' +
            'pass -PteamNumber=<team> on the command line or set "teamNumber" in ' +
            '.wpilib/wpilib_preferences.json')
}
def parseTeamNumber = { Object raw, String source ->
    def text = raw == null ? '' : raw.toString().trim()
    if (!(text ==~ /[1-9][0-9]{0,4}/)) {
        throw new GradleException(
                "invalid FRC team number ${raw.inspect()} from ${source}: " +
                'expected a positive integer (1 to 99999)')
    }
    return text.toInteger()
}
def readTeamNumberFromPrefs = { File prefsFile ->
    if (!prefsFile.exists()) return null
    def parsed = new JsonSlurper().parse(prefsFile)
    if (!(parsed instanceof Map) || !parsed.containsKey('teamNumber') || parsed['teamNumber'] == null) {
        return null
    }
    return parseTeamNumber(parsed['teamNumber'], prefsFile.name)
}
Integer resolvedTeamNumber = teamFromCommandLine ?
        parseTeamNumber(gradle.startParameter.projectProperties['teamNumber'], '-PteamNumber') :
        readTeamNumberFromPrefs(file('.wpilib/wpilib_preferences.json'))

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number comes from -PteamNumber=<team> or the robot
            // repository's .wpilib/wpilib_preferences.json; deploy fails in
            // gradle.taskGraph.whenReady below when neither supplies one.
            if (resolvedTeamNumber != null) {
                team = resolvedTeamNumber
            }
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcCpp(getArtifactTypeClass('FRCNativeArtifact')) {
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcCpp

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Set to true to run simulation in debug mode
wpi.cpp.debugSimulation = false

// The simulation GUI is the only way to enable the robot and choose Teleoperated
// when no real Driver Station is attached, so an interactive `simulateNative`
// gets it. Automated runs pass -Pheadless and drive the Driver Station through
// the TALOS_SIM_DS* environment variables instead; see
// src/main/include/SimDriverStation.h.
if (!project.hasProperty("headless")) {
    wpi.sim.addGui().defaultEnabled = true
}
wpi.sim.addDriverstation()

nativeUtils.platformConfigs.named("linuxathena").configure {
